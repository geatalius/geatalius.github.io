name: 이전 수영 기록 릴리즈 삭제 (1회용)
on:
  push:
    paths:
      - '.github/workflows/cleanup-swim-log-release.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 릴리즈와 태그 삭제
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view swim-log-v1.0 >/dev/null 2>&1; then
            gh release delete swim-log-v1.0 --cleanup-tag --yes
            echo "릴리즈 swim-log-v1.0 삭제 완료"
          else
            echo "릴리즈가 이미 없습니다"
            gh api -X DELETE repos/$GH_REPO/git/refs/tags/swim-log-v1.0 || true
          fi
